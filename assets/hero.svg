<text x="44" y="254" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c2)"><tspan fill="#F05138">▸ </tspan><tspan fill="#bc8cff">Linking   </tspan><tspan fill="#c9d1d9">Clean Architecture · MVVM · VIP · VIPER · SPM</tspan></text>
<text x="44" y="284" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c3)"><tspan fill="#F05138">▸ </tspan><tspan fill="#bc8cff">Securing  </tspan><tspan fill="#c9d1d9">E2EE (CryptoKit) · Keychain · SSL pinning</tspan></text>
<text x="44" y="314" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c4)"><tspan fill="#F05138">▸ </tspan><tspan fill="#bc8cff">Wiring    </tspan><tspan fill="#c9d1d9">Apple Pay · Mada · Nafath · SignalR · WebRTC</tspan></text>
<text x="44" y="344" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c5)"><tspan fill="#F05138">▸ </tspan><tspan fill="#bc8cff">Testing   </tspan><tspan fill="#c9d1d9">XCTest · XCUITest · 8+ years in production</tspan></text>
<text x="44" y="374" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c6)"><tspan fill="#F05138">▸ </tspan><tspan fill="#bc8cff">Shipping  </tspan><tspan fill="#c9d1d9">Fastlane → App Store · KSA · Iraq · Egypt</tspan></text>
<text x="44" y="404" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c7)"><tspan fill="#3fb950" font-weight="700">** BUILD SUCCEEDED ** </tspan><tspan fill="#e6edf3">Senior iOS Developer, leading 4 engineers </tspan><tspan fill="#e6edf3">▋<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
