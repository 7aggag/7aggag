<title id="t">Mohamed Haggag's career as a git log</title>
<desc id="d">A git log graph of his career, oldest at the bottom: B.Sc. Computer Science at Mansoura University, freelance iOS development, ICOSOL, Fintech-SA (iOS Developer, then promoted to Senior), ElMasadr, and Beetleware as HEAD, where he leads 4 iOS engineers.</desc>
